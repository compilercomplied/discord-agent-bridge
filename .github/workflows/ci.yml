name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Test Image
        run: docker build --target tester -t discord-agent-bridge-test .
      
      - name: Run Integration Tests
        run: docker run --rm -e SUT_TOKEN=${{ secrets.SUT_TOKEN }} -e SUT_CLIENT_ID=${{ secrets.SUT_CLIENT_ID }} -e TESTER_TOKEN=${{ secrets.TESTER_TOKEN }} -e TEST_CHANNEL_ID=${{ secrets.TEST_CHANNEL_ID }} discord-agent-bridge-test

  build:
    needs: test
    runs-on: ubuntu-latest
    if: success()
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Production Image
        run: docker build -t discord-agent-bridge:latest .
