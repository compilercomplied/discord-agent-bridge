name: CI/CD

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Pulumi CLI
        uses: pulumi/setup-pulumi@v2

      - name: Build Test Image
        run: docker build --target tester -t discord-agent-bridge-test .

      - name: Get Pulumi Secrets
        working-directory: ./iac
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
        run: |
          echo "SUT_TOKEN=$(pulumi config get discord-agent-bridge:INTEGRATION_SUT_TOKEN -s prod)" >> $GITHUB_ENV
          echo "SUT_CLIENT_ID=$(pulumi config get discord-agent-bridge:INTEGRATION_SUT_CLIENT_ID -s prod)" >> $GITHUB_ENV
          echo "TESTER_TOKEN=$(pulumi config get discord-agent-bridge:INTEGRATION_TESTER_TOKEN -s prod)" >> $GITHUB_ENV
          echo "TEST_CHANNEL_ID=$(pulumi config get discord-agent-bridge:INTEGRATION_TEST_CHANNEL_ID -s prod)" >> $GITHUB_ENV
      
      - name: Run Integration Tests
        run: docker run --rm -e SUT_TOKEN=${{ env.SUT_TOKEN }} -e SUT_CLIENT_ID=${{ env.SUT_CLIENT_ID }} -e TESTER_TOKEN=${{ env.TESTER_TOKEN }} -e TEST_CHANNEL_ID=${{ env.TEST_CHANNEL_ID }} discord-agent-bridge-test

  build-and-push:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Image Name
        run: |
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >>${GITHUB_ENV}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./iac
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Pulumi CLI
        uses: pulumi/setup-pulumi@v2

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: iac/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Setup Kubeconfig
        run: |
          echo "${{ secrets.KUBECONFIG }}" > kubeconfig.yaml
          chmod 600 kubeconfig.yaml
          echo "KUBECONFIG=$(pwd)/kubeconfig.yaml" >> $GITHUB_ENV

      - name: Lowercase Image Name
        run: |
          echo "FULL_IMAGE_NAME=${REGISTRY}/${IMAGE_NAME,,}" >> $GITHUB_ENV

      - name: Set Pulumi Config
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TAG="sha-${SHORT_SHA}"
          echo "Deploying image: $FULL_IMAGE_NAME:$TAG"
          pulumi config set DOCKER_IMAGE "$FULL_IMAGE_NAME:$TAG" --stack prod

      - name: Pulumi Up
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
        run: pulumi up --yes --stack prod
